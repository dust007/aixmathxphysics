<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI × Math × Physics</title>
  <meta name="description" content="Notes and experiments at the intersection of AI, mathematics and physics.">
  <style>
    :root { --bg: #f6f3ec; --ink: #17171b; --muted: #6b675f; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1015; --ink: #ece7dd; --muted: #958f84; } }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--ink);
      font-family: "Iowan Old Style", Georgia, serif;
    }
    main { text-align: center; }
    h1 { font-weight: 400; font-size: clamp(2.2rem, 8vw, 4.5rem); letter-spacing: -0.02em; margin: 0 0 12px; }
    p { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>AI × Math × Physics</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
